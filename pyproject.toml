[project]
name = "spine"
version = "0.1.0"
description = "A benchmark for what an LLM does when the user pushes back: does it fold when the user is wrong, and listen when the user is right?"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Paul Davis" }]
requires-python = ">=3.11"
keywords = ["llm", "evals", "benchmark", "sycophancy", "claude", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=1.26",
]

[project.scripts]
spine = "spine.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PT", "RET", "TID", "PL",
]
ignore = [
    "PLR0911", # too many return statements: answer parsing reads better flat
    "PLR0912", # too many branches: same
    "PLR0913", # too many arguments: constructors take keyword config
    "PLR2004", # magic values are difficulty tables and test expectations
    "PLR0915", # too many statements: the generators are one flat table each
    "PLR0917", # too many positional arguments: chart helpers take their panel spec
    "RUF001",  # ×, − and ′ in strings are deliberate: they are what the items say
    "RUF002",  # same, in docstrings
    "RUF003",  # same, in comments
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=spine --cov-report=term-missing"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["spine"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
